name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0); leave empty for HEAD"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          # iSH on iPad: 32-bit Alpine/musl. Cross via zig (same as local tablet builds).
          - target: i686-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            zigbuild: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig (musl cross)
        if: matrix.zigbuild
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build release binary
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build release binary (zigbuild)
        if: matrix.zigbuild
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name || inputs.tag || github.sha }}"
          VERSION="${VERSION#v}"
          NAME="lrmux-${VERSION}-${{ matrix.target }}"
          mkdir -p dist/"$NAME"
          cp "target/${{ matrix.target }}/release/lrmux" dist/"$NAME"/
          cp LICENSE README.md dist/"$NAME"/
          tar -C dist -czf "dist/${NAME}.tar.gz" "$NAME"
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          echo "ASSET=dist/${NAME}.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=dist/${NAME}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Upload release assets
        if: github.event_name == 'release' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}

      - name: Upload workflow artifacts
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: lrmux-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  # crates.io Trusted Publishing. The publisher on crates.io must name
  # this file (release.yml) and leave Environment empty — this job sets none.
  publish:
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Require tag to match Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          tag="${tag#v}"
          ver=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          echo "tag=$tag cargo=$ver"
          test "$tag" = "$ver"

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          ver=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          code=$(curl -sS -A "lrmux-release" -o /dev/null -w "%{http_code}" \
            "https://crates.io/api/v1/crates/lrmux/${ver}")
          if [ "$code" = "200" ]; then
            echo "lrmux $ver is already on crates.io"
            exit 0
          fi
          if [ "$code" != "404" ]; then
            echo "unexpected crates.io status $code"
            exit 1
          fi
          cargo publish --locked
